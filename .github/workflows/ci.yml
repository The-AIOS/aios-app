name: CI

# Gate: compile, unit tests, and the six-gate smoke (window + pty + state +
# workbench + pulse + theme) must pass on macOS — the shell's home platform.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Compile + unit (ubuntu — cheap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts # skip electron download for unit-only
      - run: npm run compile
      - run: node --test out/test/*.test.js

  smoke:
    # macOS minutes bill 10× on private repos — full smoke runs on PRs + manual,
    # not every push. The local pre-commit habit covers pushes.
    name: Six-gate smoke (macOS)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx electron-rebuild -f -w node-pty
      - run: npm run compile

      # Two smoke gates read the operator's framework — one discovers agents/commands/skills, one
      # opens a file and counts what rendered. A bare runner has neither, so they used to fail on
      # ABSENT FIXTURES rather than on the build, which is why smoke was kept out of the release
      # lane. They now skip when there is no framework root, which is honest but leaves a worse
      # hole: a gate that CAN skip will eventually skip silently.
      #
      # So provide a root, then forbid skipping. AIOS_SMOKE_STRICT=1 turns "did not run" into a
      # failure — if the fixture ever stops taking effect, CI says so instead of quietly measuring
      # nothing. The fixture is synthetic by construction and grants NO workspace folder, so the
      # viewer gate has to reach its probe through the framework root alone (granting one would
      # mask the very bug that made that gate pass on one machine and fail everywhere else).
      - name: Minimal framework fixture, so the gates run instead of skipping
        run: node scripts/make-vault-fixture.mjs --out "$RUNNER_TEMP/aios-fixture"

      - run: npm run smoke
        env:
          GLASS_FRAMEWORK_PATH: ${{ runner.temp }}/aios-fixture
          AIOS_SMOKE_STRICT: '1'

  linux-dist:
    # Why this exists: a contributor's "it builds and the gates pass on Linux Mint" is a claim,
    # and the repo's own doctrine is that a check you ran beats a claim you were handed. This is
    # that check — and it runs on x64, which is the arch we would actually ship, unlike any
    # Apple-silicon machine a maintainer might test on locally.
    #
    # Free on a public repo, so the only cost is wall-clock; gated to PRs + manual like the
    # macOS smoke, since that is exactly when the answer matters.
    name: Linux build + packaged verify (x64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      # electron-builder shells out to these for the .deb target. dpkg is present on the runner;
      # fakeroot is not always, and its absence fails late with a confusing message.
      - name: Packaging tools for the deb target
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - run: npm ci

      # NOT optional, and the single most important line in this job. node-pty publishes no
      # Linux prebuild (upstream ships darwin-* and win32-* only), so the Linux .node exists
      # ONLY because this step compiles it. Skip it and electron-builder happily packages a tree
      # whose native module is missing or the wrong ABI: the app boots, the window paints, the
      # menu works, and every terminal is dead on arrival.
      - run: npx electron-rebuild -f -w node-pty
      - run: npm run compile

      # Unit suite on Linux too. Most of it is platform-agnostic, but the accelerator formatter
      # now has a non-mac branch, and that branch shipped a literal "Ctrl+Plus" precisely because
      # nothing ever exercised it off macOS.
      - run: node --test out/test/*.test.js

      # Build both artifacts, then verify the SHIPPED tree — including a magic-number check that
      # node-pty's .node is genuinely ELF, and a launch of the packaged binary. Electron needs a
      # display for that launch, hence xvfb; without it the live check fails for a reason that
      # has nothing to do with the build.
      - name: Build AppImage + deb, verify the packaged tree
        run: xvfb-run --auto-servernum npm run dist:linux

      # Step 1's payoff: the same validator that guards macOS releases, pointed at what the
      # Linux build produced. The question it answers is not hypothetical — electron-builder
      # decides which artifact `latest-linux.yml` names, and if it ever names the .deb, Linux
      # users would install fine and then never update, silently, because electron-updater has
      # no deb updater at all.
      #
      # The tag here is derived from package.json, so the tag↔version assertion is trivially
      # satisfied — that one only has teeth at release time. What has teeth here: the manifest
      # parses, its target is a format AppImageUpdater accepts, and every file it enumerates
      # actually exists.
      - name: Is the Linux update feed usable?
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          node scripts/assert-release-assets.mjs --tag "$TAG" --platform linux --local

      - name: Keep the artifacts for inspection (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: warn
          retention-days: 7

  windows-dist:
    # The mirror of linux-dist for Windows — a contributor's "it builds and runs on Windows" is a
    # claim; this is the check, on x64, the arch we ship. node-pty is N-API with a win32 prebuild,
    # so there is NO electron-rebuild step and no Visual Studio dependency: dist:win passes
    # --config.npmRebuild=false and the shipped prebuild is used as-is (verify-package asserts the
    # PE .node + the ConPTY helper set, the win32 analog of the Linux ELF check).
    #
    # Free on a public repo, gated to PRs + manual like the other dist jobs.
    name: Windows build + packaged verify (x64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # windows-latest defaults `run:` to PowerShell, but the step bodies below use bash syntax
    # ($(...), node -p in a subshell), so pin bash for the whole job. Git Bash ships on the runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile

      # Unit suite on Windows too: the path.sep, shell-resolution and PowerShell-quoting branches
      # only exist on this platform, and a branch nothing exercises ships broken (the "Ctrl+Plus"
      # lesson, one platform over). A directory arg, not a glob — Node's runner discovers *.test.js
      # under it identically whether npm invoked it through cmd.exe, pwsh, or bash.
      - run: node --test out/test

      # Build the nsis installer, then verify the SHIPPED tree — a PE .node, the ConPTY/winpty
      # helper set, and a launch of the packaged AIOS.exe --smoke. No xvfb: Windows runners have a
      # desktop session, and there is no chrome-sandbox to configure.
      - run: npm run dist:win

      # The same feed validator the other platforms use, pointed at the Windows artifacts.
      # electron-updater's NsisUpdater reads the unqualified latest.yml + the installer .exe; if a
      # future edit dropped either, Windows clients would 404 on every update, silently.
      - name: Is the Windows update feed usable?
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          node scripts/assert-release-assets.mjs --tag "$TAG" --platform win32 --local

      - name: Keep the artifacts for inspection (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
