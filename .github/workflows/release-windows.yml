name: Release (Windows)

# Builds the nsis installer on a real x64 Windows runner and ATTACHES it to an existing Release.
#
# Deliberately upload-only, for the same reason as the Linux lane: electron-updater's GitHub
# provider resolves its feed from the NEWEST release, then fetches that release's platform manifest.
# A release that exists without `latest-mac.yml` — even briefly — makes every mac client's updater
# 404. So the mac job owns CREATION; this one only adds to what already exists.
#
# The Windows manifest is the UNQUALIFIED `latest.yml` (electron-builder's convention for the
# Windows/NsisUpdater feed), disjoint from `latest-mac.yml` and `latest-linux.yml` — so this lane
# never touches the other platforms' feeds, and its own concurrency group keeps it from serializing
# against them.
#
# node-pty is N-API and ships a win32 prebuild, so there is NO electron-rebuild step and no Visual
# Studio dependency — dist:win uses the prebuild as-is, and verify-package asserts the PE .node plus
# the ConPTY helper set (the win32 analog of the Linux ELF check).
#
# `ref` is a separate input for the same reason the Linux lane documents: a tag that predates
# Windows support cannot be checked out and built, so the first Windows release builds a later
# commit and labels it for the published tag — a deliberate, logged divergence.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag to attach the Windows installer to, e.g. v0.8.2'
        required: true
      ref:
        description: 'Commit/branch to BUILD (blank = build the tag itself, which is the normal case)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write   # upload assets to an existing Release

concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build · verify · attach (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45   # a hang fails in minutes, never GitHub's 6 h cancel (0.13.0 review)
    # windows-latest defaults `run:` to PowerShell; the step bodies use bash ($(...), sha256sum,
    # seq, gh). Git Bash ships on the runner, so pin bash for the whole job.
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      BUILD_REF: ${{ github.event.inputs.ref }}
      # Code signing (issue #42): SSL.com eSigner, an OV certificate in SSL.com's cloud HSM, so the
      # runner signs with no hardware token. `yes` only when the repo holds the eSigner secrets; a
      # step's `if:` cannot read a secret directly, so the job states whether one exists.
      ESIGNER: ${{ secrets.ES_USERNAME != '' && 'yes' || 'no' }}
    steps:
      - name: Announce what is being built, and against what
        run: |
          echo "attaching to tag : $RELEASE_TAG"
          echo "building ref     : ${BUILD_REF:-$RELEASE_TAG (the tag itself)}"
          if [ -n "$BUILD_REF" ]; then
            echo "::warning::Building $BUILD_REF but labelling the artifacts for $RELEASE_TAG — deliberate divergence, see this workflow's header"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run compile

      # Same discipline as every release lane: the one place a release is cut is the one place
      # everything must pass. A directory arg, not a glob — runs identically under bash/cmd/pwsh.
      - run: node --test --test-timeout=120000 "out/test/*.test.js"

      # CodeSignTool, pinned by version AND by checksum: the release path ships to non-technical
      # users, so the signer is never "whatever SSL.com serves today". It carries its own JDK, so
      # the runner needs nothing else. Bump both lines together, from SSL.com's GitHub releases.
      - name: Install CodeSignTool (pinned), only when signing credentials exist
        if: env.ESIGNER == 'yes'
        shell: pwsh
        run: |
          $url = 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip'
          $want = '4AFC32E8B7F79BBE1DE7E4E7049AAAD4E0F754357613B9BBEC0E3052F06FD36B'
          Invoke-WebRequest -Uri $url -OutFile cst.zip
          $got = (Get-FileHash cst.zip -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "CodeSignTool checksum mismatch: got $got, want $want" }
          Expand-Archive cst.zip -DestinationPath "$env:RUNNER_TEMP\cst"
          Add-Content -Path $env:GITHUB_ENV -Value "CODE_SIGN_TOOL_DIR=$env:RUNNER_TEMP\cst"

      # Build the nsis installer and verify the SHIPPED tree (PE .node + ConPTY helpers + a launch
      # of the packaged AIOS.exe --smoke). No xvfb — Windows runners have a desktop session.
      # Signing happens INSIDE this step (scripts/sign-windows.cjs, electron-builder's signer hook),
      # so AIOS.exe, the installer and its uninstaller are all signed before latest.yml records the
      # installer's sha512. With no secrets the hook signs nothing and the build is as before.
      - name: Build nsis installer, verify the packaged tree
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: npm run dist:win

      # Windows' own verdict on what will ship, not the signing tool's: the app inside and the
      # installer must both carry a valid Authenticode signature from the publisher. A signed
      # release that fails here never reaches the draft.
      - name: Verify the Windows signatures
        if: env.ESIGNER == 'yes'
        shell: pwsh
        run: |
          $files = @('dist\win-unpacked\AIOS.exe') + (Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            "{0}: {1} · {2}" -f $f, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed ($($s.Status))" }
            if ($s.SignerCertificate.Subject -notmatch 'Pulsar Labs') { throw "$f is signed by '$($s.SignerCertificate.Subject)', not Pulsar Labs" }
          }

      # The installer as a run artifact, so a signed build can be installed and checked by hand
      # BEFORE any release exists (a dispatch against an already-published tag builds, signs and
      # verifies, then the attach step refuses the live release: this is what it leaves behind).
      - name: Keep the installer as a run artifact (hand test before a release)
        uses: actions/upload-artifact@v4
        with:
          name: AIOS-windows-x64-${{ env.RELEASE_TAG }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

      # Existing users first: install the last PUBLISHED release (unsigned up to 0.14.1), then run
      # this build's installer over it silently, the way electron-updater does (/S --updated). The
      # installed app must be this version, and signed by Pulsar Labs when this build is signed.
      # Installs with no publisherName skip electron-updater's own signature check, so this is
      # the check that an unsigned install takes a signed update cleanly.
      - name: Upgrade over the last published release, as the updater does
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          "previous published release: $prev"
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download $prev --repo $env:GITHUB_REPOSITORY --pattern 'AIOS-x64.exe' --dir prev --clobber
          Start-Process -FilePath 'prev\AIOS-x64.exe' -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AIOS\AIOS.exe'
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter AIOS.exe | Select-Object -First 1).FullName }
          if (-not $exe -or -not (Test-Path $exe)) { throw "the previous release ($prev) did not install" }
          "installed before: {0} at {1}" -f (Get-Item $exe).VersionInfo.ProductVersion, $exe
          $new = Get-ChildItem dist\AIOS-x64.exe | Select-Object -First 1
          Start-Process -FilePath $new.FullName -ArgumentList '/S','--updated' -Wait
          Start-Sleep -Seconds 5
          $want = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $got = (Get-Item $exe).VersionInfo.ProductVersion
          "installed after: $got (want $want)"
          if (-not $got.StartsWith($want)) { throw "after the upgrade the installed app is $got, not $want" }
          if ($env:ESIGNER -eq 'yes') {
            $s = Get-AuthenticodeSignature -LiteralPath $exe
            "installed app signature: {0} · {1}" -f $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'Pulsar Labs') { throw "the upgraded app is not validly signed by Pulsar Labs" }
          }

      # Only the x64 binaries ship in the x64 installer: arm64 copies never run here, and each
      # signed file costs one of the plan's yearly signings.
      - name: No arm64 binaries in the x64 package
        shell: bash
        run: |
          if find dist/win-unpacked -ipath '*arm64*' -name '*.exe' | grep -q .; then
            find dist/win-unpacked -ipath '*arm64*' -name '*.exe'; echo "::error::arm64 executables in the x64 package"; exit 1
          fi
          echo "no arm64 executables in the x64 package"

      - name: Say plainly when this build is unsigned
        if: env.ESIGNER != 'yes'
        run: echo "::warning::No eSigner secrets in this repo, so the Windows installer is UNSIGNED (issue #42). Smart App Control will block it on a clean Windows 11 machine."

      - name: Is the feed this build produced usable?
        run: node scripts/assert-release-assets.mjs --tag "$RELEASE_TAG" --platform win32 --local

      # On a tag push, mac is still notarizing when this starts, so the release may not exist yet.
      # Wait rather than fail — bounded, and never create it (see the header).
      - name: Wait for the Release to exist (mac owns creation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll for the mac MANIFEST, not merely the release. `gh release create` returns as soon
          # as the release object exists, while its assets are still uploading — so "the release
          # exists" cleared 14s before latest-mac.yml was attached on v0.8.3, and the fingerprint
          # step below failed instantly on a file that was moments from arriving. The Linux lane
          # was skipped and v0.8.3 shipped with no Linux feed at all, which is precisely the
          # breakage this workflow's header warns about, caused by the guard meant to prevent it.
          # Wait for the thing the next step actually reads.
          for i in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest-mac.yml'; then
              echo "release $RELEASE_TAG exists (draft or public) AND latest-mac.yml is attached"; exit 0
            fi
            echo "waiting for $RELEASE_TAG's mac manifest to land… ($i/60)"; sleep 30
          done
          echo "::error::$RELEASE_TAG was never published — refusing to create it, because a release without latest-mac.yml breaks every mac client's updater"
          exit 1

      # Attaching Windows must not disturb the mac feed. --clobber only replaces the files it is
      # given (disjoint from mac's), but "should not" is not "did not" — so measure it.
      - name: Fingerprint the mac feed before touching the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'latest-mac.yml' --dir before --clobber 2>/dev/null \
            || { echo "::error::$RELEASE_TAG has no latest-mac.yml — this is not a release mac clients can update from; stopping"; exit 1; }
          sha256sum before/latest-mac.yml | awk '{print $1}' > before/mac.sha
          echo "latest-mac.yml sha256: $(cat before/mac.sha)"

      - name: Attach the Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never touch files on a release that is already PUBLIC (0.11.0 review blocker): users'
          # updaters read it, and overwriting a live feed is how a working update breaks.
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::$RELEASE_TAG is already published — refusing to upload or overwrite files on a live release"; exit 1
          fi
          ls -la dist/*.exe dist/*.exe.blockmap dist/latest.yml
          gh release upload "$RELEASE_TAG" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber

      - name: Confirm the Windows feed is usable on the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/assert-release-assets.mjs --tag "$RELEASE_TAG" --platform win32

      - name: Confirm the mac feed was not disturbed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'latest-mac.yml' --dir after --clobber
          BEFORE=$(cat before/mac.sha)
          AFTER=$(sha256sum after/latest-mac.yml | awk '{print $1}')
          echo "before: $BEFORE"
          echo "after : $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::latest-mac.yml CHANGED — mac clients would see an update they were not meant to get"
            exit 1
          fi
          echo "✓ the mac feed is byte-identical; no mac client sees anything from this run"

      # ALL OR NOTHING (operator's decision, 0.11.0). The Release is a DRAFT until every platform's
      # feed is attached; this lane publishes it only if it completes the set. A missing feed just
      # leaves the draft a draft — electron-updater ignores drafts, so nobody sees half a release.
      - name: Publish only when all three platforms are attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-gate.mjs --tag "$RELEASE_TAG"
